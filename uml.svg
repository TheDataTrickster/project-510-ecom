<rect x="34" y="176" width="1562" height="300" fill="none" stroke="#b06bd0" stroke-width="1.2" rx="3"/>
<path d="M34,176 h42 v16 l-10,8 h-32 Z" fill="#efd8f7" stroke="#b06bd0" stroke-width="1"/>
<text x="40" y="191" font-size="12" font-weight="bold" fill="#5a2b74">ALT</text>
<text x="84" y="190" font-size="12" fill="#333">[Ввод через чат (естественный язык)]</text>
<rect x="48" y="314" width="1534" height="146" fill="none" stroke="#b06bd0" stroke-width="1.2" rx="3"/>
<path d="M48,314 h42 v16 l-10,8 h-32 Z" fill="#efd8f7" stroke="#b06bd0" stroke-width="1"/>
<text x="54" y="329" font-size="12" font-weight="bold" fill="#5a2b74">ALT</text>
<text x="98" y="328" font-size="12" fill="#333">[intent=unknown / нет обязательных параметров]</text>
<rect x="34" y="576" width="1562" height="1124" fill="none" stroke="#b06bd0" stroke-width="1.2" rx="3"/>
<path d="M34,576 h42 v16 l-10,8 h-32 Z" fill="#efd8f7" stroke="#b06bd0" stroke-width="1"/>
<text x="40" y="591" font-size="12" font-weight="bold" fill="#5a2b74">ALT</text>
<text x="84" y="590" font-size="12" fill="#333">[Данных нет / источник недоступен]</text>
<rect x="48" y="852" width="1534" height="216" fill="none" stroke="#b06bd0" stroke-width="1.2" rx="3"/>
<path d="M48,852 h50 v16 l-10,8 h-40 Z" fill="#efd8f7" stroke="#b06bd0" stroke-width="1"/>
<text x="54" y="867" font-size="12" font-weight="bold" fill="#5a2b74">LOOP</text>
<text x="106" y="866" font-size="12" fill="#333">[По каждой позиции (SKU)]</text>
<rect x="48" y="1130" width="1534" height="108" fill="none" stroke="#b06bd0" stroke-width="1.2" rx="3"/>
<path d="M48,1130 h42 v16 l-10,8 h-32 Z" fill="#efd8f7" stroke="#b06bd0" stroke-width="1"/>
<text x="54" y="1145" font-size="12" font-weight="bold" fill="#5a2b74">OPT</text>
<text x="98" y="1144" font-size="12" fill="#333">[Задан budget_limit]</text>
<rect x="48" y="1438" width="1534" height="200" fill="none" stroke="#b06bd0" stroke-width="1.2" rx="3"/>
<path d="M48,1438 h42 v16 l-10,8 h-32 Z" fill="#efd8f7" stroke="#b06bd0" stroke-width="1"/>
<text x="54" y="1453" font-size="12" font-weight="bold" fill="#5a2b74">ALT</text>
<text x="98" y="1452" font-size="12" fill="#333">[Ответ в чате]</text>
<rect x="34" y="1708" width="1562" height="238" fill="none" stroke="#b06bd0" stroke-width="1.2" rx="3"/>
<path d="M34,1708 h42 v16 l-10,8 h-32 Z" fill="#efd8f7" stroke="#b06bd0" stroke-width="1"/>
<text x="40" y="1723" font-size="12" font-weight="bold" fill="#5a2b74">OPT</text>
<text x="84" y="1722" font-size="12" fill="#333">[Изменение параметров (период / лимит / страх. запас)]</text>
<rect x="34" y="1954" width="1562" height="238" fill="none" stroke="#b06bd0" stroke-width="1.2" rx="3"/>
<path d="M34,1954 h42 v16 l-10,8 h-32 Z" fill="#efd8f7" stroke="#b06bd0" stroke-width="1"/>
<text x="40" y="1969" font-size="12" font-weight="bold" fill="#5a2b74">OPT</text>
<text x="84" y="1968" font-size="12" fill="#333">[Экспорт / передача в ABS]</text>
<rect x="40" y="40" width="170" height="44" rx="6" fill="#e8eef7" stroke="#3b5b8c" stroke-width="1.5"/>
<text x="125" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">Управляющий</text>
<rect x="270" y="40" width="170" height="44" rx="6" fill="#e8eef7" stroke="#3b5b8c" stroke-width="1.5"/>
<text x="355" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">MVP UI / Чат</text>
<rect x="500" y="40" width="170" height="44" rx="6" fill="#e8eef7" stroke="#3b5b8c" stroke-width="1.5"/>
<text x="585" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">LLM</text>
<text x="585" y="76" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">(понимание + объяснение)</text>
<rect x="730" y="40" width="170" height="44" rx="6" fill="#e8eef7" stroke="#3b5b8c" stroke-width="1.5"/>
<text x="815" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">Backend API</text>
<rect x="960" y="40" width="170" height="44" rx="6" fill="#e8eef7" stroke="#3b5b8c" stroke-width="1.5"/>
<text x="1045" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">Расчётный модуль</text>
<text x="1045" y="76" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">(детерм.)</text>
<rect x="1190" y="40" width="170" height="44" rx="6" fill="#e8eef7" stroke="#3b5b8c" stroke-width="1.5"/>
<text x="1275" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">Модуль алертов</text>
<rect x="1420" y="40" width="170" height="44" rx="6" fill="#e8eef7" stroke="#3b5b8c" stroke-width="1.5"/>
<text x="1505" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2d3d">Хранилище данных</text>
<line x1="125" y1="130" x2="355" y2="130" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="240" y="124" font-size="13" text-anchor="middle" fill="#1f2d3d">1. Выбор объекта + период (или вопрос в чате)</text>
<line x1="355" y1="222" x2="585" y2="222" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="470" y="216" font-size="13" text-anchor="middle" fill="#1f2d3d">2. message + контекст (объект, период, лимит)</text>
<line x1="585" y1="268" x2="355" y2="268" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="470" y="262" font-size="13" text-anchor="middle" fill="#5a6b82">3. intent + сущности (sku, объект, период, budget_limit) + confidence</text>
<line x1="355" y1="360" x2="125" y2="360" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="240" y="354" font-size="13" text-anchor="middle" fill="#5a6b82">4. Уточняющий вопрос (без догадки)</text>
<line x1="125" y1="406" x2="355" y2="406" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="240" y="400" font-size="13" text-anchor="middle" fill="#1f2d3d">5. Уточнённые параметры</text>
<line x1="355" y1="484" x2="815" y2="484" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="585" y="478" font-size="13" text-anchor="middle" fill="#1f2d3d">6. POST /purchase-plan {объект, период, [лимит], [страх. запас]}</text>
<line x1="815" y1="530" x2="1505" y2="530" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="1160" y="524" font-size="13" text-anchor="middle" fill="#1f2d3d">7. Запрос остатков, движений, заказов, цен, сроков, загрузки</text>
<line x1="1505" y1="622" x2="815" y2="622" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="1160" y="616" font-size="13" text-anchor="middle" fill="#5a6b82">8. Пустой ответ / ошибка</text>
<line x1="815" y1="668" x2="355" y2="668" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="585" y="662" font-size="13" text-anchor="middle" fill="#5a6b82">9. Ошибка данных</text>
<line x1="355" y1="714" x2="125" y2="714" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="240" y="708" font-size="13" text-anchor="middle" fill="#5a6b82">10. «Нет данных», предложить сменить параметры</text>
<line x1="48" y1="760" x2="1582" y2="760" stroke="#b06bd0" stroke-width="1" stroke-dasharray="3 3"/>
<text x="815" y="755" font-size="12" text-anchor="middle" font-style="italic" fill="#5a2b74">[Данные получены]</text>
<line x1="1505" y1="806" x2="815" y2="806" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="1160" y="800" font-size="13" text-anchor="middle" fill="#5a6b82">11. Датасет (as_of)</text>
<line x1="815" y1="898" x2="1045" y2="898" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="930" y="892" font-size="13" text-anchor="middle" fill="#1f2d3d">12. Рассчитать потребность (history, sku, horizon, params)</text>
<rect x="879" y="944" width="332" height="62" fill="#fff4c2" stroke="#d9b400" stroke-width="1" rx="2"/>
<text x="1045" y="960" font-size="12" text-anchor="middle" fill="#5a4a00">средний расход → прогноз → страховой запас →</text>
<text x="1045" y="976" font-size="12" text-anchor="middle" fill="#5a4a00">точка заказа → объём (округл. до упаковки/</text>
<text x="1045" y="992" font-size="12" text-anchor="middle" fill="#5a4a00">мин. партии) → стоимость</text>
<line x1="1045" y1="1014" x2="815" y2="1014" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="930" y="1008" font-size="13" text-anchor="middle" fill="#5a6b82">13. forecast_demand, recommended_qty, cost, reorder_point, explanation</text>
<path d="M815,1076 h16 v20 h-16" fill="none" stroke="#1f2d3d" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="839" y="1080" font-size="13" fill="#1f2d3d">14. Собрать план: строки + by_month / by_category / by_product</text>
<path d="M815,1176 h16 v20 h-16" fill="none" stroke="#1f2d3d" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="839" y="1180" font-size="13" fill="#1f2d3d">15. Сравнить план с лимитом → over_limit_by</text>
<line x1="815" y1="1246" x2="1275" y2="1246" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="1045" y="1240" font-size="13" text-anchor="middle" fill="#1f2d3d">16. Проверить риски по позициям плана</text>
<rect x="1060" y="1292" width="430" height="46" fill="#fff4c2" stroke="#d9b400" stroke-width="1" rx="2"/>
<text x="1275" y="1308" font-size="12" text-anchor="middle" fill="#5a4a00">дефицит / низкий остаток / излишек / нет движения /</text>
<text x="1275" y="1324" font-size="12" text-anchor="middle" fill="#5a4a00">срок годности (FEFO) / рост цен / резкое изменение расхода</text>
<line x1="1275" y1="1346" x2="815" y2="1346" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="1045" y="1340" font-size="13" text-anchor="middle" fill="#5a6b82">17. warnings (level, evidence, metrics, recommendation)</text>
<line x1="815" y1="1392" x2="355" y2="1392" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="585" y="1386" font-size="13" text-anchor="middle" fill="#5a6b82">18. План + бюджет + explanation + warnings (числа из CALC)</text>
<line x1="355" y1="1484" x2="585" y2="1484" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="470" y="1478" font-size="13" text-anchor="middle" fill="#1f2d3d">19. Оформить ответ на русском (данные плана + explanation)</text>
<rect x="454" y="1530" width="262" height="46" fill="#fff4c2" stroke="#d9b400" stroke-width="1" rx="2"/>
<text x="585" y="1546" font-size="12" text-anchor="middle" fill="#5a4a00">LLM только формулирует текст,</text>
<text x="585" y="1562" font-size="12" text-anchor="middle" fill="#5a4a00">числа берёт из ответа API как есть</text>
<line x1="585" y1="1584" x2="355" y2="1584" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="470" y="1578" font-size="13" text-anchor="middle" fill="#5a6b82">20. Текст + таблица + follow_up</text>
<line x1="355" y1="1646" x2="125" y2="1646" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="240" y="1640" font-size="13" text-anchor="middle" fill="#5a6b82">21. План квартала: таблица, бюджет, риски, обоснование</text>
<line x1="125" y1="1754" x2="355" y2="1754" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="240" y="1748" font-size="13" text-anchor="middle" fill="#1f2d3d">22. Новые параметры</text>
<line x1="355" y1="1800" x2="815" y2="1800" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="585" y="1794" font-size="13" text-anchor="middle" fill="#1f2d3d">23. POST /purchase-plan (пересчёт без перезагрузки)</text>
<line x1="815" y1="1846" x2="355" y2="1846" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="585" y="1840" font-size="13" text-anchor="middle" fill="#5a6b82">24. Обновлённый план</text>
<line x1="355" y1="1892" x2="125" y2="1892" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="240" y="1886" font-size="13" text-anchor="middle" fill="#5a6b82">25. Пересчитанный результат</text>
<line x1="125" y1="2000" x2="355" y2="2000" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="240" y="1994" font-size="13" text-anchor="middle" fill="#1f2d3d">26. Экспортировать план</text>
<line x1="355" y1="2046" x2="815" y2="2046" stroke="#1f2d3d" stroke-width="1.4"  marker-end="url(#arrow)"/>
<text x="585" y="2040" font-size="13" text-anchor="middle" fill="#1f2d3d">27. Запрос экспорта</text>
<line x1="815" y1="2092" x2="355" y2="2092" stroke="#5a6b82" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
<text x="585" y="2086" font-size="13" text-anchor="middle" fill="#5a6b82">28. Файл / передача в след. этап ABS</text>
<rect x="57" y="2138" width="1516" height="30" fill="#fff4c2" stroke="#d9b400" stroke-width="1" rx="2"/>
<text x="815" y="2154" font-size="12" text-anchor="middle" fill="#5a4a00">✕ Автоматическое размещение заказа в MVP не выполняется</text>
</svg>